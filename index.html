<!DOCTYPE html>
<html lang="en">
  <head>
    <meta http-equiv="content-type" content="text/html; charset=UTF-8">
    <meta http-equiv="content-language" content="en">
    <meta http-equiv="content-script-type" content="text/javascript">
    <meta http-equiv="content-style-type" content="text/css">
    <meta name="description" content="This is the online markdown editor with live preview.">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <meta name="theme-color" content="#444444">
    <meta name="referrer" content="no-referrer">
    <link rel="apple-touch-icon" href="%BASE_URL%icons/apple-touch-icon.png">

    <script>
      (function(){
        try {
          var BOOT_THEME_KEY = 'com.markdownlivepreview_theme';
          var raw = localStorage.getItem(BOOT_THEME_KEY);
          var useDark = raw === 'dark';
          document.documentElement.setAttribute('data-theme', useDark ? 'dark' : 'light');

          var PREVIEW_CSS_LIGHT = '%BASE_URL%css/github-markdown-light.css?v=e3dc51b8a261';
          var PREVIEW_CSS_DARK = '%BASE_URL%css/github-markdown-dark_dimmed.css?v=df221bf84b9d';
          var href = useDark ? PREVIEW_CSS_DARK : PREVIEW_CSS_LIGHT;

          var link = document.createElement('link');
          link.id = 'gh-markdown-link';
          link.rel = 'stylesheet';
          link.type = 'text/css';
          link.href = href;
          document.head.appendChild(link);
        } catch (e) {
          // ignore — app will correct theme after load
        }
      })();
    </script>
    <link rel="stylesheet" type="text/css" href="%BASE_URL%css/style.css?v=9044c252f6ef">
    <link rel="icon" type="image/png" href="%BASE_URL%favicon.png">
    <script type="module" src="/src/main.js?v=1.13.0"></script>
    <title>Markdown Live Preview</title>
  </head>

  <body>

    <header>
        <div id="menu-items">
            <div><a href="%BASE_URL%">Markdown Live Preview</a></div>
            <div><button type="button" id="open-button">Open</button></div>
            <input type="file" id="open-file-input" accept=".md,.markdown,text/markdown" hidden>
            <div id="copy-button"><a href="#">Copy</a></div>
            <div id="export-button"><a href="#">Export PDF</a></div>
            <div id="reset-button"><a href="#">Reset</a></div>
            <details id="autosave-dropdown">
              <summary>Autosaves</summary>
              <div id="autosave-menu">
                <p id="autosave-empty">No autosaves yet. Changes are saved every 10 seconds.</p>
                <ul id="autosave-list" aria-label="Saved drafts"></ul>
                <p id="autosave-status" role="status"></p>
              </div>
            </details>
            <div><button type="button" id="install-button" hidden>Install</button></div>
            <div><button type="button" id="update-button" hidden>Update</button></div>
            <div id="sync-button">
              <input type="checkbox" id="sync-scroll-checkbox"><label for="sync-scroll-checkbox">Sync scroll</label>
              <span style="margin-left:12px;"><input type="checkbox" id="theme-checkbox"><label for="theme-checkbox">Dark mode</label></span>
            </div>
        </div>
        <div id="github"><a href="https://github.com/TheoGibbons/markdown-live-preview"><img src="%BASE_URL%image/GitHub-Mark-Light-32px.webp" alt="GitHub repository"></a></div>
    </header>

    <div id="container" class="split-container">

        <div id="edit" class="column editor-pane">
            <div id="editor-wrapper">
                <div id="editor"></div>
            </div>
        </div>

        <div id="split-divider" class="split-divider"></div>

        <div id="preview" class="column preview-pane">
            <div id="preview-wrapper">
                <div id="output" class="content markdown-body"></div>
            </div>
        </div>
    </div>

    <div id="autosave-preview" role="region" aria-label="Autosave preview" tabindex="0" hidden><pre></pre></div>
  </body>
</html>
